name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DISCOVERY_DOTENV: '0'
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q --durations=15
      - run: uv run python -m discovery.evals.run --suite release --offline --skip-tests --output artifacts/evals/release.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: uv run python scripts/export_web_contract.py
      - run: npm --prefix frontend run build
      - name: API contract and generated types are committed
        run: git diff --exit-code -- docs/web-openapi.json frontend/src/api.generated.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evals
          path: artifacts/evals/release.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
