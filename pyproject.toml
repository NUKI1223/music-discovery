[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "music-discovery"
version = "0.1.0"
description = "Multi-genre music discovery with auditable recommendations"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "numpy>=2,<3",
  "scikit-learn>=1.6,<2", "streamlit>=1.42,<2", "gymnasium>=1,<2",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pwdlib[argon2]>=0.2,<1", "anyio>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[project.scripts]
discovery = "discovery.cli:main"
discovery-web = "discovery.web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
